# 测试环境的默认数据源（M5，决策 D-24）
#
# ⭐ 为什么要有这个文件
#
# 加上落库之后，**每一个 @SpringBootTest 都会连上 application.yml 里配的默认数据源**
# ——也就是开发者本机那个 localhost:3306。结果是跑一次测试就往开发库里写几十行测试数据。
#
# 这不是洁癖问题：M5 的全部目的是**拿真实对局数据校准缓存参数**，
# 而 test-run / quota-test-xxx 这类测试数据混进去，会直接把校准结果带偏。
# 实测跑一轮测试污染了 32 行里的 31 行。
#
# 而且这类污染极其隐蔽：**测试全绿，开发库静悄悄地脏了。**
#
# 解法：测试的默认数据源指向一个必然连不上的地址。
# 需要真数据库的用例（Testcontainers 那几个）用 @DynamicPropertySource 覆盖它
# ——那个的优先级更高，能盖住本文件。
#
# ⚠️ 别把这里改成一个「能连上的」地址来图省事。
#    测试要么明确要一个属于自己的数据库（Testcontainers），
#    要么就不该碰任何数据库。**共用开发库是第三种，也是最坏的一种。**

spring.datasource.url=jdbc:mysql://127.0.0.1:1/tests-must-not-touch-a-real-db?connectTimeout=300
spring.datasource.username=none
spring.datasource.password=none

# 连不上时快点失败，别让每个测试类都为此等上几秒
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=800
