# ============================================================================
# 测试专用配置
#
# ★ 存在的唯一理由：**让测试永远不碰真实 LLM。**
#
# 教训（2026-08-01）：加上 LlmClient 后第一次跑 mvn test，
# application-local.yml 里的真实 key 被加载了，测试真的打了 DeepSeek——
# 单条用例耗时 6.7 秒，而且 8 条里有 7 条"通过"其实是运气：
# 它们断言的是 stub 的固定配比，而那次 LLM 恰好也返回了合法结构。
#
# 三个后果，每一个都够格单独禁止这件事：
#   ① 测试在花钱，且随调用次数增长
#   ② 断言对象从"我的代码"变成了"模型这次说了什么"——非确定性
#   ③ CI 上没有 key 就全红，有 key 就是把 key 放进 CI（本次开工要避免的事）
#
# 这里把 key 置空，usable() 即为 false，Controller 走 stub 路径。
# 需要测 LLM 路径的用例用 @MockBean 注入假的 LlmClient——
# 那才是"测我的编排逻辑"，而不是"测模型今天心情如何"。
# ============================================================================
shm:
  llm:
    api-key: ""
