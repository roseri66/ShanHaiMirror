server:
  port: 8080

spring:
  application:
    name: director-service

  # 允许把本地配置放进 application-local.yml（已 gitignore，用来放 key）。
  # 该文件不存在时不报错——CI 与他人 clone 后照样能起。
  profiles:
    group:
      default: local
  config:
    import:
      # prompt 真源。单独成文件是为了让"改 prompt"不需要碰 application.yml，
      # 也让它在仓库里是一个能直接读的文本文件。**不是 optional**——
      # 缺了它服务起不来，这是对的：没有 prompt 的决策网关没有意义。
      - "classpath:prompt.yaml"
      # 本地配置（放 key，已 gitignore）。**是 optional**——
      # 他人 clone 后没有这个文件也能起，只是走 stub 路径。
      - "optional:classpath:application-local.yml"

  # web 用 Tomcat（servlet），webflux 只作为 HTTP 客户端库存在。
  # 不声明的话两个 starter 同时在 classpath 上会让 Spring 选 reactive，
  # 而我们的 Controller 是 servlet 风格的。
  main:
    web-application-type: servlet

  # Jackson：客户端多发字段不该让请求 400。
  # 上行契约会演进，而客户端与服务端不可能同时上线。
  jackson:
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # ── M5（决策 D-24）落库 ──
  #
  # ⭐ 硬约束①：**MySQL 连不上时，服务端必须照常返回决策，只是不落库。**
  #    落库是尽力而为的旁路 —— 让证据的采集反过来伤害被观测的系统，是本末倒置。
  #    实现它靠两条：
  #      · initialization-fail-timeout: -1 → 启动时不去建连接，连不上也不阻止启动
  #      · sql.init.mode: never            → ⭐ 建表**不能**走 Spring 自带的初始化器
  #
  #    ⚠️ 第二条是踩出来的：`spring.sql.init.mode=always` 会让
  #       dataSourceScriptDatabaseInitializer 成为启动期硬依赖，连不上就整个上下文加载失败。
  #       `continue-on-error` 救不了 —— 它只兜「脚本执行出错」，兜不住「拿不到连接」。
  #       建表改由 DatabaseBootstrap 在 ApplicationReadyEvent 里做，它自己兜异常。
  #
  #    ⚠️ 「静默降级」同样不可接受：DatabaseBootstrap 探测失败会打一条醒目的方框 WARN。
  #       静默降级会让「没落库」和「落了但查不到」无法区分，而两者的排查方向完全相反。
  datasource:
    # allowPublicKeyRetrieval=true 是 MySQL 8 的 caching_sha2_password 在非 SSL 连接下所必需。
    # ⚠️ 它允许客户端通过未加密通道索取服务端公钥，理论上可被中间人利用 ——
    #    本服务**只在本机跑、不部署公网**（D-23 已记：一个 502 的 Demo 比没有 Demo 更糟），
    #    这个取舍在这里成立；**若哪天真要连远端库，必须改用 SSL 并去掉这个参数。**
    url: ${SHM_DB_URL:jdbc:mysql://localhost:3306/shm_director?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${SHM_DB_USER:root}
    password: ${SHM_DB_PASSWORD:root}
    hikari:
      # -1 = 启动时不做连接测试。连不上就等真正用到时再失败（那时由 recorder 兜住）
      initialization-fail-timeout: -1
      # 决策请求是低频事件（一局 2 次），落库是单线程消费者。池子不需要大。
      maximum-pool-size: 4
      minimum-idle: 1
      # ⚠️ 必须小于 MySQL 的 wait_timeout（默认 8 小时），否则会拿到已被服务端关掉的死连接
      max-lifetime: 1800000

  sql:
    init:
      # ⭐ never —— 建表由 DatabaseBootstrap 负责，理由见上面 datasource 的注释。
      #    别改回 always：那会让「连不上数据库」变成「服务起不来」。
      mode: never

logging:
  level:
    com.shanhai.director: INFO

# 可观测（M4）。**只暴露 health 与 prometheus 两个端点**——
# actuator 默认还带 env / configprops / beans / heapdump，
# 其中 env 与 configprops 会把配置打出来。虽然 Spring 对
# 名字含 key/secret/password 的项做了脱敏，但依赖它的启发式规则
# 来保护 API key 是不必要的风险：**用不到的端点就别开**。
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never   # 不对外暴露内部组件细节
  metrics:
    tags:
      application: director-service

# ⚠️ M1 起才用得到。key 走环境变量或 application-local.yml，**绝不写在这里**。
#
# 注意 ${SHM_LLM_API_KEY:} 的空值兜底与"未配置"是两种语义，别混——
# 这是踩坑 #20（setx 无法置空、占位值让 Provider 误判可用）的服务端版：
# 空字符串是一个"配置了但值为空"的状态，判可用性时必须把它和真正的
# 未配置一起当成不可用，否则又会出现"配了但用不了却一直重试"。
shm:
  llm:
    api-key: ${SHM_LLM_API_KEY:}
    base-url: ${SHM_LLM_BASE_URL:https://api.deepseek.com/v1}
    model: ${SHM_LLM_MODEL:deepseek-chat}
    timeout-seconds: ${SHM_LLM_TIMEOUT:10}
