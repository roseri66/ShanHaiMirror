# 决策回放器 → GitHub Pages
#
# 站点是 README 里「Live Demo」那条链接的落点，面试官点开的就是它。
# 因此这条流水线里**测试是硬门槛**：跑不过就不部署 ——
# 一个挂掉的演示站比没有演示站更糟。
name: 部署决策回放器

on:
  push:
    branches: [master]
    paths:
      - 'WebReplay/**'
      # 样例是 build 时 import 进产物的（不放副本，见 WebReplay/src/samples/index.ts），
      # 所以样例变了同样要重新构建，否则线上还是旧数据
      - 'Docs/samples/**'
      - '.github/workflows/deploy-webreplay.yml'
  # 允许手动触发：首次启用 Pages、或想在不改代码的情况下重新发布
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一次部署；排队而不是取消，避免把已经发出去的部署打断
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与本机开发环境一致（Node v24.16 / npm 11.13）
          node-version: '24'
          cache: npm
          cache-dependency-path: WebReplay/package-lock.json

      - name: 安装依赖
        working-directory: WebReplay
        run: npm ci

      - name: 跑测试（不过就不部署）
        working-directory: WebReplay
        run: npm test

      - name: 构建（含 vue-tsc 类型检查）
        working-directory: WebReplay
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: WebReplay/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
